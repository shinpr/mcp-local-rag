# Enable BuildKit for cache mounts and faster layer export:
#   export DOCKER_BUILDKIT=1 COMPOSE_BAKE=true
# Optional: persist buildx cache across machines (see README "Fast rebuilds").

services:
  # PostgreSQL database for metadata storage
  # Only used when DB_HOST=localhost. Start with: docker compose --profile local-db up
  postgres:
    profiles: ["local-db"]
    image: postgres:16-alpine
    container_name: mcp-rag-postgres
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mcp-rag-network

  # Backend API server
  # Builds DATABASE_URL from DB_* env vars in code — no hardcoded URL needed here.
  # Container paths and bind address are set below so .env can stay tuned for local dev.
  api:
    build:
      context: .
      dockerfile: Dockerfile
      cache_from:
        - mcp-rag-api:latest
      args:
        GIT_REVISION: ${GIT_REVISION:-unknown}
    image: mcp-rag-api:latest
    pull_policy: build
    container_name: mcp-rag-api
    restart: unless-stopped
    # Override image CMD so a stale cached layer cannot resurrect dist/cli-main.js serve
    command: ["node", "dist/index.js", "serve"]
    env_file: .env
    environment:
      API_HOST: 0.0.0.0
      DB_PATH: /app/lancedb
      CACHE_DIR: /app/models
      # Match local dev layout (DB_PATH/uploads) so host bind-mounts work
      UPLOAD_DIR: /app/lancedb/uploads
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-50}
    volumes:
      # LanceDB + uploads live on the host filesystem (file-based DB, not a network service).
      # Local dev: ./lancedb (default). Ubuntu server: set LANCEDB_HOST_PATH in .env, e.g.
      #   LANCEDB_HOST_PATH=/var/lib/mcp-local-rag/lancedb
      # Run scripts/setup-lancedb-ubuntu.sh on the server to create that directory.
      - ${LANCEDB_HOST_PATH:-./lancedb}:/app/lancedb
      - ${MODEL_CACHE_HOST_PATH:-./models}:/app/models
    ports:
      - "${API_PORT}:3939"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3939/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 180s
      retries: 12
    networks:
      - mcp-rag-network

  # Frontend web UI
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      cache_from:
        - mcp-rag-web:latest
    image: mcp-rag-web:latest
    container_name: mcp-rag-web
    restart: unless-stopped
    env_file: .env
    environment:
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-50}
    depends_on:
      api:
        condition: service_started
    ports:
      - "${WEB_PORT:-80}:80"
    networks:
      - mcp-rag-network

volumes:
  postgres_data:
    driver: local

networks:
  mcp-rag-network:
    driver: bridge
